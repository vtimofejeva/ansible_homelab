---

- hosts: all
  become: true
  tasks:

    - name: install fail2ban
      ansible.builtin.apt:
        name:
          - fail2ban
        state: present

    - name: restore the config of fail2ban from backup
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: 0644
      notify: restart fail2ban service

    - name: ensure fail2ban is Enabled and Running
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

  handlers:
    - name: restart fail2ban service
      ansible.builtin.service:
        name: fail2ban
        state: restarted

services:
    db:
        image: postgres:16
        networks:
            - homenet
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
        ports:
            - "xxxx:xx"
        restart: unless-stopped
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} #using .env for password
            - POSTGRES_USER=__user__
            - POSTGRES_DB=joplindb
    app:
        image: joplin/server:latest
        networks:
            - homenet
        depends_on:
            - db
        ports:
            - "xxxx:xx"
        restart: unless-stopped
        environment:
            - APP_PORT=xxxx
            - APP_BASE_URL=http://x.x.x.x:xxxx
            - DB_CLIENT=pg
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} #using .env for password
            - POSTGRES_DATABASE=joplindb
            - POSTGRES_USER=__user__
            - POSTGRES_PORT=xxxx
            - POSTGRES_HOST=db

networks:
  homenet:
    external: true
